# Netlify settings for the Flyover frontend.
# Netlify detects Next.js by itself, so no publish directory is set here.
# Set NEXT_PUBLIC_API_BASE_URL on the Netlify dashboard (see DEPLOY.md), because it depends on your backend address.
[build]
  base = "frontend"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_USE_MOCKS = "false"
